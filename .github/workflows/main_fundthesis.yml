name: Build and deploy Node.js app to Azure Web App - Fundthesis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install + build (Next standalone)
        run: |
          cd Frontend

          # env for build
          cat > .env.local << 'EOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EOF

          npm ci
          npm run build

          # Build output must be standalone for Azure App Service
          # This requires next.config.js => output: "standalone"
          test -d .next/standalone

          # Create deployment folder
          mkdir -p ../deploy
          cp -R .next/standalone/* ../deploy/
          mkdir -p ../deploy/.next
          cp -R .next/static ../deploy/.next/static
          cp -R public ../deploy/public || true

          # Verify server.js exists for Azure startup
          test -f ../deploy/server.js || (echo "ERROR: server.js not found in deploy folder" && exit 1)
          echo "✓ server.js found, deployment structure verified"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7EDA8E94C6BD4776A51B83E85A01B168 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EBD35B074BBF49BBB46AEB35EECCF751 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C712BA5896CF447C995950775B71D60B }}

      - name: Configure Azure Web App startup command
        run: |
          RESOURCE_GROUP=$(az webapp show --name Fundthesis --query resourceGroup -o tsv)
          az webapp config set \
            --name Fundthesis \
            --resource-group "$RESOURCE_GROUP" \
            --startup-file "node server.js"
          az webapp config appsettings set \
            --name Fundthesis \
            --resource-group "$RESOURCE_GROUP" \
            --settings WEBSITES_CONTAINER_START_TIME_LIMIT=1800 \
            --output none

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Fundthesis
          slot-name: Production
          package: ./node-app
