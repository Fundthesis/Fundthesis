# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Fundthesis

# Trigger the workflow on push to main or manual dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # --------------------
  # BUILD JOB
  # --------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      # Checkout repository code
      - name: Checkout repo
        uses: actions/checkout@v4

      # Set up Node.js (use LTS for Azure compatibility)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      # Install dependencies, build Next.js app, and run tests (if present)
      - name: npm install, build, and test
        run: |
          cd Frontend

          # Create env file for Next.js build
          touch .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local

          # Install dependencies and build
          npm install
          npm run build
          npm run test --if-present

      # Upload the entire Frontend directory as an artifact
      # This includes package.json, .next, public/, etc.
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: Frontend

  # --------------------
  # DEPLOY JOB
  # --------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build # Ensures deploy only runs after successful build
    permissions:
      id-token: write # Required for Azure OIDC login
      contents: read # Required for actions/checkout (not used, but safe)

    steps:
      # Download the artifact produced in the build job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: node-app

      # Sanity check to confirm artifact contents
      - name: Verify artifact contents
        run: |
          echo "Current directory:"
          pwd
          ls -la
          echo "Downloaded artifact contents:"
          ls -la node-app

      # Authenticate to Azure using OpenID Connect
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7EDA8E94C6BD4776A51B83E85A01B168 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EBD35B074BBF49BBB46AEB35EECCF751 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C712BA5896CF447C995950775B71D60B }}

      # Deploy the downloaded artifact to Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: Fundthesis
          slot-name: Production
          package: ./node-app
