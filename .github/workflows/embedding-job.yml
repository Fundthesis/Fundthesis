name: Embedding Job

on:
  schedule:
    - cron: '30 */4 * * *'  # Every 4 hours at :30 (offset from scraper)
  workflow_dispatch:  # Allow manual triggering
    inputs:
      batch_size:
        description: 'Number of articles per batch'
        required: false
        default: '50'

jobs:
  generate-embeddings:
    runs-on: ubuntu-latest
    name: Generate Article Embeddings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Prisma Client
        working-directory: ./backend
        run: |
          prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Embedding Job
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_EMBED_ENDPOINT: ${{ secrets.AZURE_EMBED_ENDPOINT }}
          AZURE_EMBED_KEY: ${{ secrets.AZURE_EMBED_KEY }}
          AZURE_EMBED_MODEL_NAME: ${{ secrets.AZURE_EMBED_MODEL_NAME }}
        run: |
          python -m rag.index_articles

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: embedding-job-logs
          path: backend/*.log
          if-no-files-found: ignore
